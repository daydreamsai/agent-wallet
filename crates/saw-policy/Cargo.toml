[package]
name = "saw-policy"
version = "0.1.0"
edition = "2021"
description = "Policy agent for SAW threshold signing — holds Share 2, evaluates rules, auto-cosigns"

[dependencies]
saw-mpc = { path = "../saw-mpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "saw-policy"
path = "src/main.rs"
