[package]
name = "saw-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
cggmp21 = { version = "0.6", features = ["hd-wallet", "curve-secp256k1"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
ethereum-types = "0.14"
futures = "0.3"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rlp = "0.5"
saw-mpc = { path = "../saw-mpc" }
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sha3 = "0.10"
signal-hook = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
saw = { path = "../saw-cli" }

[[bin]]
name = "saw-daemon"
path = "src/main.rs"
